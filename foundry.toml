[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.26"
evm_version = "cancun"
fs_permissions = [{ access = "read-write", path = "./web" }]

# ponytail: raised from forge's 2^30 default. `Review14_schedule_frozen` sweeps ~100 fresh
# Mono/pool triples in one test, and since `Mono` moved onto a real v4 pool each of those
# deploys a `PoolManager`-backed pool and a hook instead of a 60-line mock. The test's logic is
# unchanged; only the scaffolding got heavier. Lower it again if a test ever needs 8x this.
gas_limit = 8589934592

# ponytail: a second profile instead of widening `src` — `acrus_test/` is a live-rail probe and
# must never end up in the default build. Run it with `FOUNDRY_PROFILE=arcus`.
[profile.arcus]
src = "acrus_test"
test = "acrus_test"
script = "acrus_test"
out = "out-arcus"
libs = ["lib"]
solc = "0.8.26"
evm_version = "cancun"

# ponytail: named here rather than passed as a raw URL, so `--rpc-url chain4663` resolves through
# forge's own `.env` loading and the endpoint is never typed on a command line.
[rpc_endpoints]
chain46630 = "${RPC_URL_46630}"
chain4663 = "${RPC_URL_4663}"

# ponytail: remappings live in `remappings.txt`, not here — Foundry and the editor's Solidity
# extension both read that file, so there is no second list to drift. v4-core rides along inside
# v4-periphery (same commit CCA pins, 59d3ecf5) — one submodule, no second copy either.

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
